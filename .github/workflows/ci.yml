# CI is the only networked part of the project: it installs dev tools from PyPI on GitHub's
# runners. The shipped tool itself has no runtime network access.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The project promises Linux, Windows and macOS support, so all three are exercised.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # the project's pinned version
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Format (black)
        run: black --check src tests
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Types (mypy)
        run: mypy src tests
      - name: Tests (pytest)
        run: pytest -q
