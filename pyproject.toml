[build-system]
requires = ["setuptools>=77"]  # 77+ reads the SPDX license string below
build-backend = "setuptools.build_meta"

[project]
name = "stigforage"
dynamic = ["version"]
description = "Offline STIG checklist assessment toolkit (working name)."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "structlog>=24.1",
]

[project.optional-dependencies]
# Exact pins so CI and every .venv run the same checks; see ADR 0004. Bump them deliberately at
# the start of a roadmap stage, in their own commit, with the full suite. The runtime
# dependency above stays a range: stigforage is also installable as a library.
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
    "black==26.10.1",
    "mypy==2.4.1",
    "jsonschema==4.26.0",  # cross-checks schema.py in tests/test_schema.py; never a runtime dep
    "openpyxl==3.1.5",  # cross-checks xlsx.py in tests/test_poam.py; never a runtime dep
]

[project.scripts]
stigforage = "stigforage.cli:main"

[tool.setuptools.dynamic]
version = { attr = "stigforage.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
# Embedded XML literals in tests are clearer unwrapped.
"tests/*" = ["E501"]

[tool.ruff.lint.pylint]
# Keyword-only builders (make_rule/make_stig) legitimately take many named arguments.
max-args = 12

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
